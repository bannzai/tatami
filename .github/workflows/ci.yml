name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # public リポジトリのため macOS runner は無料 (private では使わない方針の例外)。
  # 実行コマンドは AGENTS.md「検証方法」の make target と一致させる
  build-and-test:
    runs-on: macos-26
    if: ${{ !contains(github.event.pull_request.title, '[Skip CI]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      - name: Build
        run: make build-macos CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: make test CODE_SIGNING_ALLOWED=NO
